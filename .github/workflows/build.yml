name: Notchling native build and core checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build portable core
        run: dotnet build src/Notch.Core/Notch.Core.csproj --configuration Release
      - name: Build configurable billing service
        run: dotnet build src/Notch.Billing/Notch.Billing.csproj --configuration Release
      - name: Execute package-free functional tests
        run: dotnet run --project tests/Notch.Core.Tests/Notch.Core.Tests.csproj --configuration Release
      - name: Execute billing and entitlement regressions
        run: dotnet run --project tests/Notch.Commerce.Tests/Notch.Commerce.Tests.csproj --configuration Release
      - name: Execute simulated view-model lifecycle regressions
        run: dotnet run --project tests/Notch.ViewModel.Tests/Notch.ViewModel.Tests.csproj --configuration Debug
      - name: Verify Release defaults to Free and gates direct commands
        run: dotnet run --project tests/Notch.ViewModel.Tests/Notch.ViewModel.Tests.csproj --configuration Release
      - name: Execute linked native service scenarios with platform doubles
        run: dotnet run --project tests/Notch.Native.Tests/Notch.Native.Tests.csproj --configuration Release
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile native source and XAML member projections
        run: python scripts/check-native-source.py
      - name: Verify notice generation and fail-closed release checks
        run: python -m unittest discover -s tests/release -v

  windows:
    name: Windows x64 installer and launch (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate Windows release script syntax
        shell: pwsh
        run: |
          Get-ChildItem -Path scripts,packaging/windows -Filter '*.ps1' | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Exercise prerequisite handling in Windows PowerShell 5.1
        shell: pwsh
        run: ./scripts/invoke-prerequisite-check.ps1 -Mode Unit
      - name: Exercise Windows App Runtime module-not-found recovery
        shell: pwsh
        run: ./scripts/invoke-prerequisite-check.ps1 -Mode RuntimeFallback
      - name: Exercise the missing-dotnet download and installer path
        shell: pwsh
        run: ./scripts/invoke-prerequisite-check.ps1 -Mode Integration
      - name: Build native WinUI application
        run: dotnet build src/Notch.Windows/Notch.Windows.csproj --configuration Release -p:Platform=x64
      - name: Publish application without bundled shared runtimes
        run: >-
          dotnet publish src/Notch.Windows/Notch.Windows.csproj
          --configuration Release --runtime win-x64 --self-contained false
          -p:Platform=x64 -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=false -p:PublishSingleFile=false
          --output artifacts/notchling-windows-x64
      - name: Measure published app and reject bundled runtimes
        run: python scripts/report-package-size.py --publish artifacts/notchling-windows-x64 --require-app-only --output artifacts/package-size.json
      - name: Install evaluation installer compiler
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          if (-not (Test-Path $iscc)) { throw 'The Inno Setup 6 compiler is missing.' }
          Write-Output "Installer compiler: $((Get-Item $iscc).VersionInfo.FileVersion)"
      - name: Bundle publisher and installer notices
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          $license = Join-Path (Split-Path $iscc) 'license.txt'
          $version = (Get-Item $iscc).VersionInfo.FileVersion
          python scripts/bundle-notices.py --publish artifacts/notchling-windows-x64 --assets src/Notch.Windows/obj/project.assets.json --installer-license $license --installer-version $version
          if ($LASTEXITCODE -ne 0) { throw 'Notice generation failed.' }
      - name: Compile single-file evaluation setup
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/Notch.Windows/Notch.Windows.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $publish = Join-Path $PWD 'artifacts/notchling-windows-x64'
          $output = Join-Path $PWD 'artifacts/installer'
          $PSNativeCommandUseErrorActionPreference = $false
          $compilerOutput = & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' /DEvaluationBuild "/DAppVersion=$version" "/DPublishDirectory=$publish" "/DReleaseDirectory=$output" packaging/windows/Notch.iss 2>&1
          $compilerExit = $LASTEXITCODE
          $compilerOutput | Write-Output
          if ($compilerExit -ne 0) {
            $details = ($compilerOutput | Select-Object -Last 15 | ForEach-Object ToString) -join ' | '
            Write-Output "::error::Evaluation installer compilation failed: $details"
            throw 'Evaluation installer compilation failed.'
          }
      - name: Measure setup and enforce app-only payload
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts/installer/*-evaluation-setup.exe | Select-Object -First 1 -ExpandProperty FullName
          python scripts/report-package-size.py --publish artifacts/notchling-windows-x64 --require-app-only --installer $setup --output artifacts/package-size.json
          if ($LASTEXITCODE -ne 0) { throw 'App-only package verification failed.' }
      - name: Install and launch the actual evaluation setup
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts/installer/*-evaluation-setup.exe | Select-Object -First 1 -ExpandProperty FullName
          $install = Join-Path $env:RUNNER_TEMP 'Notchling.InstallerSmoke'
          $log = Join-Path $PWD 'artifacts/installer-smoke.log'
          $prerequisiteLog = Join-Path $env:LOCALAPPDATA 'Notchling/Setup/Logs/setup-prerequisites.log'
          $prerequisiteLines = @()
          function ConvertTo-WorkflowData([string]$Message) {
            return $Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          }
          $result = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$install`"", "/LOG=`"$log`"") -Wait -PassThru
          if (Test-Path -LiteralPath $prerequisiteLog) {
            if ((Get-Item -LiteralPath $prerequisiteLog).Length -gt 1048576) {
              throw 'The prerequisite diagnostic log exceeded its 1 MiB cloud-test limit.'
            }
            Copy-Item -LiteralPath $prerequisiteLog -Destination artifacts/setup-prerequisites.log
            $prerequisiteLines = @(Get-Content -LiteralPath $prerequisiteLog)
          }
          if ($result.ExitCode -ne 0) {
            $details = if ($prerequisiteLines.Count -gt 0) { ($prerequisiteLines | Select-Object -Last 12) -join ' | ' } else { (Get-Content $log -Tail 12) -join ' | ' }
            $failure = ConvertTo-WorkflowData "Evaluation setup failed: $($result.ExitCode). $details"
            Write-Output "::error::$failure"
            throw 'Evaluation setup failed. See installer-smoke.log.'
          }
          if ($prerequisiteLines.Count -eq 0) { throw 'Successful setup did not produce prerequisite verification evidence.' }
          $downloadedBytes = 0L
          foreach ($line in $prerequisiteLines) {
            if ($line -match '\bDownloaded (\d+) bytes from [a-z0-9.-]+\.') { $downloadedBytes += [long]$Matches[1] }
          }
          $dotNetInstalled = @($prerequisiteLines | Where-Object { $_ -match 'Downloading the current stable \.NET 10 runtime from Microsoft\.' }).Count -gt 0
          $dotNetReused = -not $dotNetInstalled -and @($prerequisiteLines | Where-Object { $_ -match 'Shared \.NET runtime already present:' }).Count -gt 0
          $scope = if ($dotNetReused) { 'Shared .NET was reused; missing-.NET installation was not exercised.' } else { 'A missing .NET prerequisite was installed during this run.' }
          $summary = "Setup prerequisite download bytes: $downloadedBytes; .NET runtime reused: $dotNetReused. $scope This cloud test does not qualify bare Windows 10/11 or denied-UAC/offline behavior."
          Write-Output "::notice::$(ConvertTo-WorkflowData $summary)"
          $recognized = 'Shared \.NET runtime already present:|Downloading the current stable \.NET 10 runtime|Downloading Windows App Runtime|Downloaded \d+ bytes from|Verified Windows App Runtime installer version:|Windows App Runtime 1\.8 framework, Main, Singleton and DDLM are registered|All prerequisites verified for the current user\.'
          foreach ($line in ($prerequisiteLines | Where-Object { $_ -match $recognized } | Select-Object -Last 7)) {
            Write-Output "::notice::$(ConvertTo-WorkflowData $line)"
          }
          $app = Get-ChildItem (Join-Path $install 'app') -Filter Notchling.Windows.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $app) { throw 'The installer did not create the application.' }
          try {
            ./scripts/smoke-windows.ps1 -AppPath $app -ReportPath artifacts/windows-smoke.json
          } finally {
            $uninstall = Join-Path $install 'unins000.exe'
            if (Test-Path $uninstall) {
              $cleanup = Start-Process -FilePath $uninstall -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
              if ($cleanup.ExitCode -ne 0) { throw "Smoke-test uninstall failed: $($cleanup.ExitCode)." }
            }
          }
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.os == 'windows-latest' && 'notchling-windows-x64-installer' || 'notchling-windows-x64-installer-windows-2022' }}
          path: artifacts/installer/*-evaluation-setup.exe
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.os == 'windows-latest' && 'notchling-windows-x64-app-only' || 'notchling-windows-x64-app-only-windows-2022' }}
          path: artifacts/notchling-windows-x64/*
          compression-level: 9
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ matrix.os == 'windows-latest' && 'notchling-windows-cloud-test-results' || 'notchling-windows-cloud-test-results-windows-2022' }}
          path: |
            artifacts/package-size.json
            artifacts/windows-smoke.json
            artifacts/windows-ui-smoke.json
            artifacts/installer-smoke.log
            artifacts/setup-prerequisites.log
            artifacts/prerequisite-tests/
          if-no-files-found: warn
          retention-days: 14

  evaluation:
    name: Publish tested evaluation EXE
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/notchling-evaluation-')
    needs: [core, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: notchling-windows-x64-installer
          path: artifacts/installer
      - name: Publish one setup EXE after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTCH_EVALUATION_TAG: ${{ github.ref_name }}
          NOTCH_EVALUATION_RUN: ${{ github.run_id }}
          NOTCH_EVALUATION_REVISION: ${{ github.sha }}
        run: |
          [[ "$NOTCH_EVALUATION_TAG" =~ ^notchling-evaluation-[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          NOTCH_EVALUATION_VERSION="${NOTCH_EVALUATION_TAG#notchling-evaluation-}"
          NOTCH_PROJECT_VERSION="$(python3 -c 'import xml.etree.ElementTree as e; print(e.parse("src/Notch.Windows/Notch.Windows.csproj").findtext("PropertyGroup/Version"))')"
          [[ "$NOTCH_EVALUATION_VERSION" == "$NOTCH_PROJECT_VERSION" ]] || exit 1
          NOTCH_SETUP_NAME="Notchling-${NOTCH_EVALUATION_VERSION}-windows-x64-evaluation-setup.exe"
          NOTCH_SETUP_PATH="artifacts/installer/$NOTCH_SETUP_NAME"
          [[ -f "$NOTCH_SETUP_PATH" ]] || exit 1
          NOTCH_SETUP_HASH="$(sha256sum "$NOTCH_SETUP_PATH" | cut -d ' ' -f 1)"
          NOTCH_SETUP_BYTES="$(stat -c %s "$NOTCH_SETUP_PATH")"
          NOTCH_SETUP_MEGABYTES="$(python3 -c 'import sys; print(f"{int(sys.argv[1]) / 1000000:.2f}")' "$NOTCH_SETUP_BYTES")"
          cat > evaluation-notes.md <<EOF
          Download **$NOTCH_SETUP_NAME** below and run Setup. No developer SDK or manual dependency setup is required.

          This unsigned Windows x64 evaluation passed native installation, launch, Free media empty-state controls, Pomodoro start/pause/reset, scratchpad persistence, and uninstall in [cloud CI](https://github.com/$GH_REPO/actions/runs/$NOTCH_EVALUATION_RUN). Source: $NOTCH_EVALUATION_REVISION.

          Setup installs missing shared .NET and Windows App Runtime components automatically. This app installer is **$NOTCH_SETUP_MEGABYTES MB**. Missing components require additional one-time downloads; [runtime estimates and cloud measurements](https://github.com/$GH_REPO/blob/$NOTCH_EVALUATION_REVISION/docs/release-delivery.md) explain the first-install cost. Existing compatible components are reused.

          Windows 10 22H2 and Windows 11 are release targets; full consumer hardware/accessibility qualification remains pending. Premium billing is not live. Publisher signing and production release approval remain required.

          Installer bytes: $NOTCH_SETUP_BYTES

          Installer SHA-256: $NOTCH_SETUP_HASH
          EOF
          gh release create "$NOTCH_EVALUATION_TAG" "$NOTCH_SETUP_PATH" --verify-tag --prerelease --latest=false --title "Notchling $NOTCH_EVALUATION_VERSION — Windows evaluation" --notes-file evaluation-notes.md
          echo "::notice title=Direct Windows evaluation download::https://github.com/$GH_REPO/releases/download/$NOTCH_EVALUATION_TAG/$NOTCH_SETUP_NAME"
