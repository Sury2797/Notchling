name: Notchling native build and core checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build portable core
        run: dotnet build src/Notch.Core/Notch.Core.csproj --configuration Release
      - name: Build configurable billing service
        run: dotnet build src/Notch.Billing/Notch.Billing.csproj --configuration Release
      - name: Execute package-free functional tests
        run: dotnet run --project tests/Notch.Core.Tests/Notch.Core.Tests.csproj --configuration Release
      - name: Execute billing and entitlement regressions
        run: dotnet run --project tests/Notch.Commerce.Tests/Notch.Commerce.Tests.csproj --configuration Release
      - name: Execute simulated view-model lifecycle regressions
        run: dotnet run --project tests/Notch.ViewModel.Tests/Notch.ViewModel.Tests.csproj --configuration Debug
      - name: Verify public-testing Release and future Freemium enforcement
        run: dotnet run --project tests/Notch.ViewModel.Tests/Notch.ViewModel.Tests.csproj --configuration Release
      - name: Execute linked native service scenarios with platform doubles
        run: dotnet run --project tests/Notch.Native.Tests/Notch.Native.Tests.csproj --configuration Release
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile native source and XAML member projections
        run: python scripts/check-native-source.py
      - name: Verify notice generation and fail-closed release checks
        run: python -m unittest discover -s tests/release -v

  windows:
    name: Windows ${{ matrix.arch }} installer and launch (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            platform: x64
            artifact_suffix: x64
          - os: windows-2022
            arch: x64
            platform: x64
            artifact_suffix: x64-windows-2022
          - os: windows-2022
            arch: x86
            platform: x86
            artifact_suffix: x86
          - os: windows-11-arm
            arch: arm64
            platform: ARM64
            artifact_suffix: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate Windows release script syntax
        shell: pwsh
        run: |
          Get-ChildItem -Path scripts,packaging/windows -Filter '*.ps1' | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Build precompiled native Setup helper
        run: dotnet build packaging/windows/native-interop/Notchling.Setup.Interop.csproj --configuration Release --output artifacts/setup-interop
      - name: Exercise prerequisite handling in Windows PowerShell 5.1
        shell: pwsh
        run: ./scripts/invoke-prerequisite-check.ps1 -Mode Unit -AppArchitecture ${{ matrix.arch }}
      - name: Exercise Windows App Runtime module-not-found recovery
        shell: pwsh
        run: ./scripts/invoke-prerequisite-check.ps1 -Mode RuntimeFallback -AppArchitecture ${{ matrix.arch }}
      - name: Exercise the missing-dotnet download and installer path
        shell: pwsh
        run: ./scripts/invoke-prerequisite-check.ps1 -Mode Integration -AppArchitecture ${{ matrix.arch }}
      - name: Build native WinUI application
        run: dotnet build src/Notch.Windows/Notch.Windows.csproj --configuration Release -p:Platform=${{ matrix.platform }}
      - name: Publish application without bundled shared runtimes
        run: >-
          dotnet publish src/Notch.Windows/Notch.Windows.csproj
          --configuration Release --runtime win-${{ matrix.arch }} --self-contained false
          -p:Platform=${{ matrix.platform }} -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=false -p:PublishSingleFile=false
          --output artifacts/notchling-windows-${{ matrix.arch }}
      - name: Measure published app and reject bundled runtimes
        run: python scripts/report-package-size.py --publish artifacts/notchling-windows-${{ matrix.arch }} --architecture ${{ matrix.arch }} --require-app-only --output artifacts/package-size.json
      - name: Install evaluation installer compiler
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          if (-not (Test-Path $iscc)) { throw 'The Inno Setup 6 compiler is missing.' }
          $compilerVersion = [version](Get-Item $iscc).VersionInfo.FileVersion
          if ($compilerVersion -lt [version]'6.7.1') { throw 'Inno Setup 6.7.1 or later is required for the native themed wizard.' }
          Write-Output "Installer compiler: $compilerVersion"
      - name: Bundle publisher and installer notices
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          $license = Join-Path (Split-Path $iscc) 'license.txt'
          $version = (Get-Item $iscc).VersionInfo.FileVersion
          python scripts/bundle-notices.py --publish artifacts/notchling-windows-${{ matrix.arch }} --assets src/Notch.Windows/obj/project.assets.json --installer-license $license --installer-version $version
          if ($LASTEXITCODE -ne 0) { throw 'Notice generation failed.' }
      - name: Render complete installer terms and privacy
        run: python scripts/render-installer-documents.py --output artifacts/installer-documents
      - name: Compile single-file evaluation setup
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/Notch.Windows/Notch.Windows.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $publish = Join-Path $PWD 'artifacts/notchling-windows-${{ matrix.arch }}'
          $output = Join-Path $PWD 'artifacts/installer'
          $PSNativeCommandUseErrorActionPreference = $false
          $compilerOutput = & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' /DEvaluationBuild "/DAppArchitecture=${{ matrix.arch }}" "/DAppVersion=$version" "/DPublishDirectory=$publish" "/DReleaseDirectory=$output" "/DNativeInteropPath=$PWD/artifacts/setup-interop/Notchling.Setup.Interop.dll" "/DInstallerDocumentsDirectory=$PWD/artifacts/installer-documents" packaging/windows/Notch.iss 2>&1
          $compilerExit = $LASTEXITCODE
          $compilerOutput | Write-Output
          if ($compilerExit -ne 0) {
            $details = ($compilerOutput | Select-Object -Last 15 | ForEach-Object ToString) -join ' | '
            Write-Output "::error::Evaluation installer compilation failed: $details"
            throw 'Evaluation installer compilation failed.'
          }
      - name: Measure setup and enforce app-only payload
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts/installer/*-evaluation-setup.exe | Select-Object -First 1 -ExpandProperty FullName
          python scripts/report-package-size.py --publish artifacts/notchling-windows-${{ matrix.arch }} --architecture ${{ matrix.arch }} --require-app-only --installer $setup --output artifacts/package-size.json
          if ($LASTEXITCODE -ne 0) { throw 'App-only package verification failed.' }
      - name: Qualify visible setup pages, install and launch the actual app
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts/installer/*-evaluation-setup.exe | Select-Object -First 1 -ExpandProperty FullName
          ./scripts/qualify-windows-installer.ps1 -SetupPath $setup -AppArchitecture ${{ matrix.arch }} -ReportDirectory artifacts
      - uses: actions/upload-artifact@v6
        with:
          name: notchling-windows-${{ matrix.artifact_suffix }}-installer
          path: artifacts/installer/*-evaluation-setup.exe
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: notchling-windows-${{ matrix.artifact_suffix }}-app-only
          path: artifacts/notchling-windows-${{ matrix.arch }}/*
          compression-level: 9
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: notchling-windows-${{ matrix.artifact_suffix }}-cloud-test-results
          path: |
            artifacts/package-size.json
            artifacts/windows-smoke.json
            artifacts/windows-ui-smoke.json
            artifacts/windows-shelf-drop.json
            artifacts/installer-smoke.log
            artifacts/installer-ui-smoke.json
            artifacts/installer-ui.log
            artifacts/installer-documents/
            artifacts/setup-prerequisites.log
            artifacts/prerequisite-tests/
            artifacts/screenshots/
          if-no-files-found: warn
          retention-days: 14

  evaluation:
    name: Publish tested x64, x86 and ARM64 evaluation apps
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/notchling-evaluation-')
    needs: [core, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: notchling-windows-x64-installer
          path: artifacts/installer
      - uses: actions/download-artifact@v6
        with:
          name: notchling-windows-x86-installer
          path: artifacts/installer
      - uses: actions/download-artifact@v6
        with:
          name: notchling-windows-arm64-installer
          path: artifacts/installer
      - name: Publish three architecture-specific setup EXEs after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTCH_EVALUATION_TAG: ${{ github.ref_name }}
          NOTCH_EVALUATION_RUN: ${{ github.run_id }}
          NOTCH_EVALUATION_REVISION: ${{ github.sha }}
        run: |
          [[ "$NOTCH_EVALUATION_TAG" =~ ^notchling-evaluation-[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          NOTCH_EVALUATION_VERSION="${NOTCH_EVALUATION_TAG#notchling-evaluation-}"
          NOTCH_PROJECT_VERSION="$(python3 -c 'import xml.etree.ElementTree as e; print(e.parse("src/Notch.Windows/Notch.Windows.csproj").findtext("PropertyGroup/Version"))')"
          [[ "$NOTCH_EVALUATION_VERSION" == "$NOTCH_PROJECT_VERSION" ]] || exit 1
          cat > evaluation-notes.md <<EOF
          Choose the **x64** setup for most Intel/AMD laptops, **ARM64** for Windows on ARM, or **x86** for 32-bit Windows 10. Download only your app Setup EXE below. No developer SDK or manual dependency setup is required.

          **All 21 tools are free for everyone during public testing.** Checkout is paused. External data still requires provider credentials or optional service setup.

          All three application architectures passed the branded installer and full formatted legal pages, installation, native launch, all-tool navigation, contextual help, hover/typing recovery, real file/image Shelf drops, connection states, credential alignment, notes/Awake, media controls, Pomodoro, scratchpad persistence and uninstall in [cloud CI](https://github.com/$GH_REPO/actions/runs/$NOTCH_EVALUATION_RUN). Source: $NOTCH_EVALUATION_REVISION.

          x64 was tested on two Windows host generations; ARM64 on a native Windows 11 ARM runner; x86 on a 64-bit Windows runner with cross-bitness UI Automation. The x86 run does not certify a consumer 32-bit Windows 10 device. Windows 11 has no 32-bit OS edition. Windows 10 22H2 and Windows 11 are targets; actual consumer hardware/accessibility qualification remains pending.

          Setup automatically installs missing shared .NET and Windows App Runtime components for your app architecture. Missing components add one-time downloads; [runtime costs and measurements](https://github.com/$GH_REPO/blob/$NOTCH_EVALUATION_REVISION/docs/release-delivery.md) explain the first-install cost. Compatible installed components are reused. This is an unsigned evaluation; production publisher signing and billing remain unconfigured.

          | App | Installer bytes | SHA-256 |
          | --- | ---: | --- |
          EOF
          NOTCH_SETUP_PATHS=()
          for NOTCH_ARCH in x64 x86 arm64; do
            NOTCH_SETUP_NAME="Notchling-${NOTCH_EVALUATION_VERSION}-windows-${NOTCH_ARCH}-evaluation-setup.exe"
            NOTCH_SETUP_PATH="artifacts/installer/$NOTCH_SETUP_NAME"
            [[ -f "$NOTCH_SETUP_PATH" ]] || exit 1
            NOTCH_SETUP_HASH="$(sha256sum "$NOTCH_SETUP_PATH" | cut -d ' ' -f 1)"
            NOTCH_SETUP_BYTES="$(stat -c %s "$NOTCH_SETUP_PATH")"
            printf '| %s | %s | %s |\n' "$NOTCH_ARCH" "$NOTCH_SETUP_BYTES" "$NOTCH_SETUP_HASH" >> evaluation-notes.md
            NOTCH_SETUP_PATHS+=("$NOTCH_SETUP_PATH")
            echo "::notice title=Direct $NOTCH_ARCH evaluation download::https://github.com/$GH_REPO/releases/download/$NOTCH_EVALUATION_TAG/$NOTCH_SETUP_NAME"
          done
          gh release create "$NOTCH_EVALUATION_TAG" "${NOTCH_SETUP_PATHS[@]}" --verify-tag --prerelease --latest=false --title "Notchling $NOTCH_EVALUATION_VERSION — Windows evaluation" --notes-file evaluation-notes.md
