<svg xmlns="http://www.w3.org/2000/svg" width="204" height="28" viewBox="0 0 204 28" role="img" aria-labelledby="title">
  <title id="title">Open the GitHub Actions Windows app build workflow</title>
  <defs>
    <clipPath id="round"><rect width="204" height="28" rx="5"/></clipPath>
    <linearGradient id="sheen" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <g clip-path="url(#round)">
    <rect width="204" height="28" fill="#24292f"/>
    <rect x="112" width="92" height="28" fill="#2563eb"/>
    <rect width="204" height="28" fill="url(#sheen)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="11" font-weight="600">
    <text x="56" y="18">GitHub Actions</text>
    <text x="158" y="18">BUILD APP</text>
  </g>
</svg>
